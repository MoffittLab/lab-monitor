<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moffitt Laboratory Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🔬 Moffitt Laboratory Dashboard</h1>
            <div class="header-info">
                <span class="last-update" id="lastUpdate">Last updated: --</span>
                <span class="status" id="status">Connecting...</span>
            </div>
        </header>

        <!-- Summary Section -->
        <section class="summary">
            <div class="summary-card">
                <h3>Lifetime Transfer</h3>
                <p class="summary-value" id="lifetimeTransferIn">0 B <span class="transfer-label">in</span></p>
                <p class="summary-value" id="lifetimeTransferOut">0 B <span class="transfer-label">out</span></p>
            </div>
            <div class="summary-card">
                <h3>Total Storage</h3>
                <p class="summary-value" id="totalStorage">—</p>
            </div>

        </section>

        <!-- NAS Grid -->
        <section class="nas-grid" id="nasGrid">
            <div class="loading">Loading NAS data...</div>
        </section>

        <!-- Metric Chart Callout -->
        <div id="chartCallout" class="chart-callout">
            <div class="chart-callout-content">
                <span class="chart-close">&times;</span>
                <h3 id="chartTitle"></h3>
                <div class="chart-container">
                    <canvas id="metricChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    <script>
        // Initialize dashboard with config
        const config = {
            refreshInterval: {{ refresh_interval }} * 1000
        };
        initDashboard(config);
    </script>
</body>
</html>
