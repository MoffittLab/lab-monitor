<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moffitt Laboratory Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🔬 Moffitt Laboratory Dashboard</h1>
            <div class="header-info">
                <span class="last-update" id="lastUpdate">Last updated: --</span>
                <span class="status" id="status">Connecting...</span>
            </div>
        </header>

        <!-- Summary Section -->
        <section class="summary">
            <div class="summary-card">
                <h3>Total Storage</h3>
                <p class="summary-value" id="totalStorage">—</p>
            </div>
            <div class="summary-card">
                <h3>Lifetime Transfer</h3>
                <div class="transfer-row">
                    <span class="summary-value" id="lifetimeTransferIn">0 B <span class="transfer-label">in</span></span>
                    <span class="transfer-divider">&bull;</span>
                    <span class="summary-value" id="lifetimeTransferOut">0 B <span class="transfer-label">out</span></span>
                </div>
            </div>
        </section>

        <!-- System Summary Strip -->
        <section class="system-summary-strip" id="systemSummaryStrip"></section>

        <!-- NAS Grid -->
        <section class="nas-grid" id="nasGrid">
            <div class="loading">Loading NAS data...</div>
        </section>

        <!-- Metric Chart Callout -->
        <div id="chartCallout" class="chart-callout">
            <div class="chart-callout-content">
                <span class="chart-close">&times;</span>
                <h3 id="chartTitle"></h3>
                
                <!-- Time Range Controls -->
                <div class="chart-controls">
                    <div class="control-group">
                        <span class="control-label">Time Range:</span>
                        <button class="range-btn" onclick="setTimeRange(24)">Last 24h</button>
                        <button class="range-btn" onclick="setTimeRange(168)">Last 7d</button>
                        <button class="range-btn" onclick="setTimeRange(720)">Last 30d</button>
                        <button class="range-btn" onclick="setTimeRange(null)">All Available</button>
                    </div>
                    <div class="control-group">
                        <span class="control-label">Custom:</span>
                        <input type="date" id="customFrom" class="date-input" />
                        <span class="date-separator">to</span>
                        <input type="date" id="customTo" class="date-input" />
                        <button class="range-btn" onclick="applyCustomRange()">Apply</button>
                    </div>
                </div>
                
                <!-- Export Controls -->
                <div class="chart-exports">
                    <button class="export-btn" onclick="exportChartPNG()" title="Download chart as PNG">📥 PNG</button>
                    <button class="export-btn" onclick="exportChartCSV()" title="Download data as CSV">📥 CSV</button>
                </div>
                
                <div class="chart-info" id="chartInfo"></div>
                <div class="chart-container">
                    <div id="metricChart"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    <script>
        // Initialize dashboard with config
        const config = {
            refreshInterval: {{ refresh_interval }} * 1000
        };
        initDashboard(config);
    </script>
</body>
</html>
